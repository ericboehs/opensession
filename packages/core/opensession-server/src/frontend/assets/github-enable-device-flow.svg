<svg xmlns="http://www.w3.org/2000/svg" width="687" height="260" viewBox="0 0 687 260">
  <rect width="687" height="260" fill="#0d1117"/>
  <g font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif">
    <text x="20" y="38" fill="#f0f6fc" font-size="19" font-weight="600">Identifying and authorizing users</text>
    <text x="20" y="63" fill="#8b949e" font-size="12">The full <tspan fill="#58a6ff" text-decoration="underline">callback URL</tspan> to redirect to after a user authorizes an installation.</text>
    <rect x="534.5" y="21.5" width="111" height="24" rx="6" fill="#21262d" stroke="#3d444d"/>
    <text x="590" y="38" fill="#f0f6fc" font-size="11" font-weight="600" text-anchor="middle">Add Callback URL</text>
    <path d="M20 74H646" stroke="#30363d"/>
    <text x="20" y="102" fill="#f0f6fc" font-size="13" font-weight="600">Callback URL</text>
    <rect x="20.5" y="111.5" width="625" height="26" rx="6" fill="#161b22" stroke="#3d444d"/>
    <text x="31" y="129" fill="#8b949e" font-size="12">e.g. https://example.com/auth</text>
    <path d="M580 112V137" stroke="#3d444d"/>
    <text x="612" y="129" fill="#f85149" font-size="12" font-weight="600" text-anchor="middle">Delete</text>
    <rect x="20.5" y="153.5" width="11" height="11" rx="2" fill="#161b22" stroke="#8b949e"/>
    <text x="36" y="164" fill="#f0f6fc" font-size="12" font-weight="600">Request user authorization (OAuth) during installation</text>
    <text x="20" y="187" fill="#8b949e" font-size="11">Requests that the installing user <tspan fill="#58a6ff" text-decoration="underline">grants access to their identity</tspan> during installation of your App.</text>
    <rect x="20.5" y="204.5" width="11" height="11" rx="2" fill="#58a6ff" stroke="#79c0ff"/>
    <path d="M23 210l2 2 4-5" fill="none" stroke="#fff" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="36" y="215" fill="#f0f6fc" font-size="12" font-weight="600">Enable Device Flow</text>
    <text x="20" y="238" fill="#8b949e" font-size="11">Allow this GitHub App to authorize users via the <tspan fill="#58a6ff" text-decoration="underline">device flow</tspan>.</text>
  </g>
</svg>
