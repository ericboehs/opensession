<svg xmlns="http://www.w3.org/2000/svg" width="687" height="519" viewBox="0 0 687 519">
  <rect width="687" height="519" fill="#0d1117"/>
  <g font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif">
    <circle cx="43" cy="52" r="10" fill="none" stroke="#1f6feb" stroke-width="6"/>
    <text x="65" y="59" fill="#f0f6fc" font-size="20" font-weight="600">All repositories</text>
    <text x="65" y="90" fill="#8b949e" font-size="17">This applies to all current and future repositories owned by the resource</text>
    <text x="65" y="111" fill="#8b949e" font-size="17">owner. Also includes public repositories (read-only).</text>
    <circle cx="43" cy="149" r="10" fill="none" stroke="#6e7681" stroke-width="2"/>
    <text x="65" y="156" fill="#f0f6fc" font-size="20" font-weight="600">Only select repositories</text>
    <text x="65" y="187" fill="#8b949e" font-size="17">Select at least one repository. Also includes public repositories (read-only).</text>
    <text x="32" y="235" fill="#f0f6fc" font-size="21">with these permissions:</text>
    <path d="M32 254H656" stroke="#3d444d"/>
    <path d="M36 301l5 5 10-12" fill="none" stroke="#3fb950" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="65" y="309" fill="#f0f6fc" font-size="20" font-weight="600">Read access to actions, checks, commit statuses, deployments,</text>
    <text x="65" y="337" fill="#f0f6fc" font-size="20" font-weight="600">and metadata</text>
    <path d="M36 369l5 5 10-12" fill="none" stroke="#3fb950" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="65" y="377" fill="#f0f6fc" font-size="20" font-weight="600">Read and write access to code, issues, and pull requests</text>
    <path d="M32 418H656" stroke="#3d444d"/>
    <rect x="32.5" y="451.5" width="121" height="43" rx="8" fill="#1f883d" stroke="#2ea043"/>
    <text x="93" y="480" fill="#fff" font-size="19" font-weight="600" text-anchor="middle">Install</text>
    <text x="187" y="479" fill="#2f81f7" font-size="19" font-weight="600">Cancel</text>
  </g>
</svg>
