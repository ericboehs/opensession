<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>OS¹</title>
    <style>
      html,
      body {
        height: 100%;
        margin: 0;
        background: #0b0809;
        color: #e8e4e2;
        font: 15px/1.5 -apple-system, BlinkMacSystemFont, sans-serif;
        -webkit-user-select: none;
      }
      body {
        display: flex;
        align-items: center;
        justify-content: center;
        -webkit-app-region: drag;
      }
      main {
        text-align: center;
        max-width: 26em;
        -webkit-app-region: no-drag;
      }
      h1 {
        font-size: 22px;
        font-weight: 600;
        margin: 0 0 8px;
      }
      p {
        color: #9b9492;
        margin: 0 0 20px;
      }
      button {
        background: #e8e4e2;
        color: #0b0809;
        border: 0;
        border-radius: 6px;
        padding: 8px 18px;
        font: inherit;
        font-weight: 500;
        cursor: pointer;
      }
      #status {
        margin-top: 14px;
        font-size: 13px;
        color: #6f6866;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Can’t reach OS¹</h1>
      <p>
        os.tella.dev is only available on the tailnet — check that Tailscale is
        running and connected, then retry.
      </p>
      <button onclick="retry()">Retry</button>
      <div id="status"></div>
    </main>
    <script>
      const APP_URL =
        new URLSearchParams(location.search).get("url") ||
        "https://os.tella.dev/";
      let attempt = 0;
      async function probe() {
        attempt++;
        document.getElementById("status").textContent =
          "Retrying automatically… (attempt " + attempt + ")";
        try {
          await fetch(APP_URL, { method: "HEAD", mode: "no-cors" });
          location.href = APP_URL;
        } catch {}
      }
      function retry() {
        location.href = APP_URL;
      }
      probe();
      setInterval(probe, 5000);
    </script>
  </body>
</html>
