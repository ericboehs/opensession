<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>OS¹</title>
    <style>
      html,
      body {
        height: 100%;
        margin: 0;
        background: #0b0809;
        color: #e8e4e2;
        font: 15px/1.5 -apple-system, BlinkMacSystemFont, sans-serif;
        -webkit-user-select: none;
      }
      body {
        display: flex;
        align-items: center;
        justify-content: center;
        -webkit-app-region: drag;
      }
      main {
        text-align: center;
        max-width: 26em;
        -webkit-app-region: no-drag;
      }
      h1 {
        font-size: 22px;
        font-weight: 600;
        margin: 0 0 8px;
      }
      p {
        color: #9b9492;
        margin: 0 0 20px;
      }
      code {
        display: block;
        margin: 16px 0 20px;
        padding: 12px;
        border: 1px solid #302b2c;
        border-radius: 6px;
        background: #151112;
        color: #d7d0ce;
        font: 12px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace;
        text-align: left;
        user-select: text;
        -webkit-user-select: text;
      }
      button {
        background: #e8e4e2;
        color: #0b0809;
        border: 0;
        border-radius: 6px;
        padding: 8px 18px;
        font: inherit;
        font-weight: 500;
        cursor: pointer;
      }
      #status {
        margin-top: 14px;
        font-size: 13px;
        color: #6f6866;
      }
      #log {
        margin-top: 10px;
        font-size: 12px;
        color: #6f6866;
        user-select: text;
        -webkit-user-select: text;
      }
    </style>
  </head>
  <body>
    <main>
      <h1 id="title">Can’t reach OS¹</h1>
      <p id="message">
        The configured OpenSession server is unavailable. Check your network
        connection and server settings, then retry.
      </p>
      <code id="command" hidden></code>
      <button id="retry" onclick="retry()">Retry</button>
      <div id="status"></div>
      <div id="log"></div>
    </main>
    <script>
      const params = new URLSearchParams(location.search);
      const APP_URL = params.get("url") || "http://127.0.0.1:3850/";
      const mode = params.get("mode") || "offline";
      const detail = params.get("detail") || "";
      const logFile = params.get("logFile") || "";
      const title = document.getElementById("title");
      const message = document.getElementById("message");
      const command = document.getElementById("command");
      const retryButton = document.getElementById("retry");
      const status = document.getElementById("status");
      const log = document.getElementById("log");

      if (mode === "starting") {
        title.textContent = "Starting local server…";
        message.textContent =
          detail || "OS¹ will open here as soon as the local server is ready.";
        retryButton.hidden = true;
        status.textContent = "Checking the local server…";
      } else if (mode === "missing") {
        title.textContent = "Local server not installed";
        message.textContent = detail;
        command.hidden = false;
        command.textContent =
          "Clone your OpenSession repository, run bun install, and configure its path in Local mode.";
        retryButton.hidden = true;
      } else if (mode === "error") {
        title.textContent = "Local server can’t start";
        message.textContent = detail;
        retryButton.hidden = true;
      } else if (mode === "local-offline") {
        title.textContent = "Local server unavailable";
        message.textContent = "OS¹ will reconnect after the local server restarts.";
        retryButton.hidden = true;
      }
      if (logFile) log.textContent = "Server log: " + logFile;

      let attempt = 0;
      async function probe() {
        if (mode !== "offline") return;
        attempt++;
        status.textContent = "Retrying automatically… (attempt " + attempt + ")";
        try {
          await fetch(APP_URL, { method: "HEAD", mode: "no-cors" });
          location.href = APP_URL;
        } catch {}
      }
      function retry() {
        location.href = APP_URL;
      }
      probe();
      setInterval(probe, 5000);
    </script>
  </body>
</html>
