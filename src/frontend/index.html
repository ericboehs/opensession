<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#0b0809" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Michael" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cdefs%3E%3ClinearGradient id='m' x1='0' y1='0' x2='0' y2='1'%3E%3Cstop offset='0' stop-color='%23ff4d4d'/%3E%3Cstop offset='1' stop-color='%23c10000'/%3E%3C/linearGradient%3E%3Cfilter id='g' x='-50%25' y='-50%25' width='200%25' height='200%25'%3E%3CfeGaussianBlur stdDeviation='1.6' result='b'/%3E%3CfeMerge%3E%3CfeMergeNode in='b'/%3E%3CfeMergeNode in='SourceGraphic'/%3E%3C/feMerge%3E%3C/filter%3E%3C/defs%3E%3Crect width='64' height='64' rx='15' fill='%230a0608'/%3E%3Ctext x='32' y='42' font-family='-apple-system,Helvetica,Arial,sans-serif' font-size='38' font-weight='800' fill='url(%23m)' text-anchor='middle' filter='url(%23g)'%3EM%3C/text%3E%3Cg fill='%23ff2222'%3E%3Crect x='17' y='49' width='3.4' height='5' rx='1' opacity='0.35'/%3E%3Crect x='23' y='49' width='3.4' height='5' rx='1' opacity='0.6'/%3E%3Crect x='29' y='49' width='3.4' height='5' rx='1' opacity='1'/%3E%3Crect x='35' y='49' width='3.4' height='5' rx='1' opacity='0.6'/%3E%3Crect x='41' y='49' width='3.4' height='5' rx='1' opacity='0.35'/%3E%3C/g%3E%3C/svg%3E" />
  <title>Michael — Tella</title>
  <script>
    // Injected at runtime so the bundler doesn't try to resolve these as build
    // assets — they're served by the backstage server, not bundled.
    (function () {
      var add = function (rel, href) {
        var l = document.createElement("link");
        l.rel = rel; l.href = href;
        document.head.appendChild(l);
      };
      add("apple-touch-icon", "/backstage/apple-touch-icon.png?v=3");
      add("manifest", "/backstage/manifest.webmanifest");

      // iOS launch images: one PNG per device, matched by an exact media query
      // (logical width/height + pixel ratio + orientation). Generated by
      // scripts/gen-splash.py. Without these, the standalone PWA launches black.
      // [ptWidth, ptHeight, ratio, pxWidth, pxHeight]
      var splashes = [
        [320, 568, 2, 640, 1136],
        [375, 667, 2, 750, 1334],
        [414, 896, 2, 828, 1792],
        [375, 812, 3, 1125, 2436],
        [390, 844, 3, 1170, 2532],
        [393, 852, 3, 1179, 2556],
        [402, 874, 3, 1206, 2622],
        [414, 736, 3, 1242, 2208],
        [414, 896, 3, 1242, 2688],
        [428, 926, 3, 1284, 2778],
        [430, 932, 3, 1290, 2796],
        [440, 956, 3, 1320, 2868]
      ];
      splashes.forEach(function (s) {
        var l = document.createElement("link");
        l.rel = "apple-touch-startup-image";
        l.media = "screen and (device-width: " + s[0] + "px) and (device-height: " + s[1] +
          "px) and (-webkit-device-pixel-ratio: " + s[2] + ") and (orientation: portrait)";
        l.href = "/backstage/splash/apple-splash-" + s[3] + "-" + s[4] + ".png";
        document.head.appendChild(l);
      });
    })();
  </script>
  <style>
    body { background: #0b0809; color: #ece7e8; font-family: -apple-system, BlinkMacSystemFont, sans-serif; }

    /* Splash screen — painted instantly from the HTML shell (before the JS
       bundle parses) so the PWA launch shows branding, not a blank dark frame.
       React removes #splash once it mounts (see App.tsx). */
    #splash {
      position: fixed;
      inset: 0;
      z-index: 9999;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 18px;
      background: radial-gradient(120% 90% at 50% 35%, #140a0c 0%, #0b0809 70%);
      opacity: 1;
      transition: opacity 0.35s ease;
    }
    #splash.splash-hide { opacity: 0; pointer-events: none; }
    .splash-logo {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 76px;
      height: 76px;
      border-radius: 20px;
      background: radial-gradient(120% 120% at 50% 38%, #1c0405 0%, #0a0608 70%);
      border: 1px solid rgba(255, 40, 40, 0.22);
      color: #ff2a2a;
      font-weight: 800;
      font-size: 40px;
      text-shadow: 0 0 14px rgba(255, 30, 30, 0.85), 0 0 4px rgba(255, 90, 90, 0.9);
      animation: splash-pulse 1.6s ease-in-out infinite;
    }
    .splash-bars {
      display: flex;
      align-items: flex-end;
      gap: 5px;
      height: 14px;
    }
    .splash-bars span {
      width: 4px;
      border-radius: 2px;
      background: #ff2222;
      animation: splash-bar 1s ease-in-out infinite;
    }
    .splash-bars span:nth-child(1) { height: 6px;  opacity: 0.4; animation-delay: 0s; }
    .splash-bars span:nth-child(2) { height: 10px; opacity: 0.7; animation-delay: 0.15s; }
    .splash-bars span:nth-child(3) { height: 14px; opacity: 1;   animation-delay: 0.3s; }
    .splash-bars span:nth-child(4) { height: 10px; opacity: 0.7; animation-delay: 0.45s; }
    .splash-bars span:nth-child(5) { height: 6px;  opacity: 0.4; animation-delay: 0.6s; }
    @keyframes splash-pulse {
      0%, 100% { transform: scale(1);    box-shadow: 0 0 0 0 rgba(255, 40, 40, 0); }
      50%      { transform: scale(1.04); box-shadow: 0 0 28px 0 rgba(255, 40, 40, 0.25); }
    }
    @keyframes splash-bar {
      0%, 100% { transform: scaleY(0.6); }
      50%      { transform: scaleY(1); }
    }
    @media (prefers-reduced-motion: reduce) {
      .splash-logo, .splash-bars span { animation: none; }
    }
  </style>
</head>
<body>
  <div id="splash">
    <span class="splash-logo">M</span>
    <span class="splash-bars"><span></span><span></span><span></span><span></span><span></span></span>
  </div>
  <div id="root"></div>
  <script type="module" src="./App.tsx"></script>
</body>
</html>
