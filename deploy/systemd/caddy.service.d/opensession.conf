[Unit]
# The Caddyfile binds os.tella.dev directly to this host's Tailscale IP. Do not
# attempt that bind before tailscaled has initialized during boot.
After=tailscaled.service
Wants=tailscaled.service

[Service]
# tailscaled can report ready just before tailscale0 receives its addresses.
# Retry the bind instead of leaving os.tella.dev down until a manual restart.
Restart=on-failure
RestartSec=5s
