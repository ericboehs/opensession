name: OS1
options:
  bundleIdPrefix: dev.tella
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true
targets:
  OS1:
    type: application
    platform: iOS
    sources:
      - OS1
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        PRODUCT_BUNDLE_IDENTIFIER: dev.tella.os1
        DEVELOPMENT_TEAM: 6GUXT43C8B
        CODE_SIGN_STYLE: Automatic
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SWIFT_VERSION: "5.9"
        TARGETED_DEVICE_FAMILY: "1"
        CURRENT_PROJECT_VERSION: 2
        MARKETING_VERSION: 0.1.0
    # Explicit scheme (replaces Xcode's autocreated one) so `xcodebuild test
    # -scheme OS1` runs the unit bundle; archive stays Release, unchanged.
    scheme:
      testTargets:
        - OS1Tests
  OS1Tests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - OS1Tests
    dependencies:
      - target: OS1
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: dev.tella.os1.tests
        SWIFT_VERSION: "5.9"
