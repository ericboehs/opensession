name: OS1
options:
  bundleIdPrefix: dev.tella
  deploymentTarget:
    iOS: "18.0"
    macOS: "15.0"
  createIntermediateGroups: true
targets:
  OS1:
    type: application
    platform: iOS
    sources:
      - OS1
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        PRODUCT_BUNDLE_IDENTIFIER: dev.tella.os1
        DEVELOPMENT_TEAM: 6GUXT43C8B
        CODE_SIGN_STYLE: Automatic
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SWIFT_VERSION: "5.9"
        TARGETED_DEVICE_FAMILY: "1"
        CURRENT_PROJECT_VERSION: 2
        MARKETING_VERSION: 0.1.0
    # Explicit scheme (replaces Xcode's autocreated one) so `xcodebuild test
    # -scheme OS1` runs the unit bundle; archive stays Release, unchanged.
    scheme:
      testTargets:
        - OS1Tests
  OS1Tests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - OS1Tests
    dependencies:
      - target: OS1
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: dev.tella.os1.tests
        SWIFT_VERSION: "5.9"
  OS1Mac:
    type: application
    platform: macOS
    sources:
      - OS1
    entitlements:
      path: OS1Mac.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.network.client: true
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.developer-tools
        PRODUCT_NAME: OS1
        # Same id as the iOS target: one App Store Connect record (universal
        # purchase) hosts both platforms. The Electron shell (os1-mac) moved
        # to dev.tella.os1.shell so no two Mac apps share a bundle id.
        PRODUCT_BUNDLE_IDENTIFIER: dev.tella.os1
        DEVELOPMENT_TEAM: 6GUXT43C8B
        CODE_SIGN_STYLE: Automatic
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIconMac
        SWIFT_VERSION: "5.9"
        CURRENT_PROJECT_VERSION: 2
        MARKETING_VERSION: 0.1.0
