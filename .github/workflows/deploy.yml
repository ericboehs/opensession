name: deploy

on:
  workflow_dispatch:
  # Enable auto-deploy once the `backstage-deploy` IAM role exists (shared-infra,
  # mirror of incident-agent-deploy). Until then, deploy via the Actions
  # "Run workflow" button — manual runs use the same OIDC role.
  # push:
  #   branches: [master]

permissions:
  contents: read
  id-token: write # OIDC -> AWS role

concurrency:
  group: deploy-backstage-prod
  cancel-in-progress: false

env:
  AWS_REGION: eu-west-2
  INSTANCE_ID: i-0df0e3818988c04ab # michael-ai (single long-lived box, not an ASG)

jobs:
  deploy:
    runs-on: ubuntu-24.04
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::486029010931:role/backstage-deploy
          aws-region: ${{ env.AWS_REGION }}

      - name: Roll the EC2 via SSM (git-pull deploy)
        run: |
          set -euo pipefail
          SHORT_SHA="${GITHUB_SHA::12}"
          CMD_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name AWS-RunShellScript \
            --comment "deploy backstage ${SHORT_SHA}" \
            --timeout-seconds 600 \
            --parameters commands="[\"bash /home/ubuntu/projects/tella-backstage/deploy/deploy.sh ${GITHUB_SHA}\"]" \
            --query 'Command.CommandId' --output text)
          echo "SSM command id: $CMD_ID"

          # Poll the invocation to completion (the on-box drain wait can take a
          # few minutes; `ssm wait` would time out, so we poll ourselves).
          for _ in $(seq 1 120); do
            sleep 5
            STATUS=$(aws ssm get-command-invocation \
              --command-id "$CMD_ID" --instance-id "$INSTANCE_ID" \
              --query 'Status' --output text 2>/dev/null || echo "Pending")
            echo "status: $STATUS"
            case "$STATUS" in
              Success) break ;;
              Failed|Cancelled|TimedOut) break ;;
            esac
          done

          echo "----- deploy output -----"
          aws ssm get-command-invocation \
            --command-id "$CMD_ID" --instance-id "$INSTANCE_ID" \
            --query 'StandardOutputContent' --output text || true
          echo "----- stderr -----"
          aws ssm get-command-invocation \
            --command-id "$CMD_ID" --instance-id "$INSTANCE_ID" \
            --query 'StandardErrorContent' --output text || true

          [ "$STATUS" = "Success" ] || { echo "::error::deploy failed with status $STATUS"; exit 1; }
