name: Sandbox release artifacts

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to attach golden images to
        required: true

permissions:
  contents: write
  packages: write
  id-token: write
  attestations: write

jobs:
  runner-image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2
      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3.7.0
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: sigstore/cosign-installer@398d4b0eeef1380460a10c8013a76f728fb906ac # v3.10.1
      - name: Resolve version tag
        id: version
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: echo "value=${RELEASE_TAG#v}" >> "$GITHUB_OUTPUT"
      - name: Build and publish multi-architecture runner
        id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          file: deploy/sandbox/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/tellahq/opensession-runner:${{ steps.version.outputs.value }}
            ghcr.io/tellahq/opensession-runner:latest
      - name: Sign immutable runner manifest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: cosign sign --yes "ghcr.io/tellahq/opensession-runner@${DIGEST}"

  microvm-golden:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: '["self-hosted","linux","x64","kvm"]'
          - arch: arm64
            runner: '["self-hosted","linux","arm64","kvm"]'
    runs-on: ${{ fromJSON(matrix.runner) }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.0
      - uses: sigstore/cosign-installer@398d4b0eeef1380460a10c8013a76f728fb906ac # v3.10.1
      - run: bun install --frozen-lockfile
      - name: Build credential-free golden from source
        run: |
          sudo -n bash deploy/sandbox/microvm/refresh-sandbox-golden.sh /opt/firecracker/sandbox-release
      - name: Package golden generation
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          asset="opensession-microvm-golden-linux-${ARCH}.tar.zst"
          sudo -n tar --zstd -C /opt/firecracker/sandbox-release -cf "$asset" \
            golden.ext4 golden.mem golden.vmstate golden.json
          sudo -n chown "$(id -u):$(id -g)" "$asset"
          sha256sum "$asset" > "$asset.sha256"
          cosign sign-blob --yes \
            --output-signature "$asset.sig" \
            --output-certificate "$asset.pem" \
            "$asset"
          echo "ASSET=$asset" >> "$GITHUB_ENV"
      - uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2.4.0
        with:
          subject-path: ${{ env.ASSET }}
      - name: Upload to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: gh release upload "$TAG" "$ASSET" "$ASSET.sha256" "$ASSET.sig" "$ASSET.pem" --clobber
