name: Release OS1 for macOS (TestFlight)

# Builds, signs and uploads the native SwiftUI OS1 client's macOS target
# (OS1Mac in os1-ios/project.yml) to TestFlight whenever os1-ios code lands on
# master — the sibling of os1-ios-testflight.yml, sharing the same app record
# (dev.tella.os1, universal purchase) and the same Apple Distribution cert.
#
# The Mac wrinkle: the App Store .pkg must be signed by a Mac Installer
# Distribution identity, and both identities share ONE private key — a second
# p12 import into an existing keychain silently skips the key's ACL, which
# makes productbuild fail with a bare "Error signing data" (bit us on the
# build box, 2026-07-24). So the keychain is built by hand with `-A` imports
# instead of the import-codesign-certs action.
#
# Unit tests are not repeated here: the iOS workflow runs the (pure-logic)
# suite on every push touching the same paths.

on:
  push:
    branches: [master]
    paths:
      - "os1-ios/**"
      - ".github/workflows/os1-mac-testflight.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: os1-mac-testflight-${{ github.event_name == 'workflow_dispatch' && github.run_id || 'push' }}
  cancel-in-progress: ${{ github.event_name == 'push' }}

defaults:
  run:
    working-directory: os1-ios

jobs:
  debounce:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Wait for development activity to settle
        if: github.event_name == 'push'
        working-directory: .
        run: sleep 900

  testflight:
    needs: debounce
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Build signing keychain (both identities, -A key access)
        env:
          DIST_P12_BASE64: ${{ secrets.OS1_IOS_DIST_P12_BASE64 }}
          DIST_P12_PASSWORD: ${{ secrets.OS1_IOS_DIST_P12_PASSWORD }}
          INSTALLER_P12_BASE64: ${{ secrets.OS1_MAC_INSTALLER_P12_BASE64 }}
          INSTALLER_P12_PASSWORD: ${{ secrets.OS1_MAC_INSTALLER_P12_PASSWORD }}
        run: |
          test -n "$DIST_P12_BASE64" && test -n "$INSTALLER_P12_BASE64"
          KC="$RUNNER_TEMP/os1-mac.keychain-db"
          KCPW=$(openssl rand -hex 16)
          security create-keychain -p "$KCPW" "$KC"
          security set-keychain-settings "$KC"
          security unlock-keychain -p "$KCPW" "$KC"
          printf '%s' "$DIST_P12_BASE64" | base64 -D > "$RUNNER_TEMP/dist.p12"
          printf '%s' "$INSTALLER_P12_BASE64" | base64 -D > "$RUNNER_TEMP/installer.p12"
          security import "$RUNNER_TEMP/dist.p12" -k "$KC" -P "$DIST_P12_PASSWORD" -A
          security import "$RUNNER_TEMP/installer.p12" -k "$KC" -P "$INSTALLER_P12_PASSWORD" -A
          rm -f "$RUNNER_TEMP/dist.p12" "$RUNNER_TEMP/installer.p12"
          # WWDR G3 intermediate — without it both identities report invalid.
          # Tolerate "already exists": GitHub runners ship it pre-installed.
          curl -fsSL https://www.apple.com/certificateauthority/AppleWWDRCAG3.cer -o "$RUNNER_TEMP/wwdrg3.cer"
          security import "$RUNNER_TEMP/wwdrg3.cer" -k "$KC" || true
          security set-key-partition-list -S "apple-tool:,apple:" -s -k "$KCPW" "$KC" > /dev/null
          security list-keychains -d user -s "$KC" login.keychain-db
          security find-identity -v "$KC"
          security find-identity -v "$KC" | grep -q "Apple Distribution: Tella HQ Inc."
          security find-identity -v "$KC" | grep -q "3rd Party Mac Developer Installer: Tella HQ Inc."
          echo "OS1_KEYCHAIN=$KC" >> "$GITHUB_ENV"

      - name: Install Mac App Store provisioning profile
        env:
          PROFILE_BASE64: ${{ secrets.OS1_MAC_PROVISIONING_PROFILE_BASE64 }}
        run: |
          test -n "$PROFILE_BASE64"
          PROFILES="$HOME/Library/MobileDevice/Provisioning Profiles"
          mkdir -p "$PROFILES"
          printf '%s' "$PROFILE_BASE64" | base64 -D > "$PROFILES/OS1_Mac_App_Store.provisionprofile"
          # Sanity: it must be the Mac App Store profile for our bundle id.
          security cms -D -i "$PROFILES/OS1_Mac_App_Store.provisionprofile" > /tmp/os1-mac-profile.plist
          grep -aq 'dev.tella.os1' /tmp/os1-mac-profile.plist

      - name: Install App Store Connect API key
        env:
          ASC_KEY_P8_BASE64: ${{ secrets.ASC_API_KEY_P8_BASE64 }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
        run: |
          test -n "$ASC_KEY_P8_BASE64"
          KEYS="$HOME/.appstoreconnect/private_keys"
          mkdir -p "$KEYS"
          printf '%s' "$ASC_KEY_P8_BASE64" | base64 -D > "$KEYS/AuthKey_${ASC_KEY_ID}.p8"

      - name: Compute build number
        id: build
        run: |
          # macOS build 3 was uploaded manually before this pipeline existed
          # (1 and 2 are the iOS platform's); offset so CI numbers stay
          # strictly increasing on the macOS platform.
          BN=$(( 3 + GITHUB_RUN_NUMBER ))
          echo "number=$BN" >> "$GITHUB_OUTPUT"
          echo "macOS build number: $BN"

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Archive
        run: |
          xcodebuild archive \
            -project OS1.xcodeproj \
            -scheme OS1Mac \
            -configuration Release \
            -destination 'generic/platform=macOS' \
            -archivePath "$RUNNER_TEMP/OS1Mac.xcarchive" \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="Apple Distribution" \
            PROVISIONING_PROFILE_SPECIFIER="OS1 Mac App Store" \
            DEVELOPMENT_TEAM=6GUXT43C8B \
            OTHER_CODE_SIGN_FLAGS="--keychain $OS1_KEYCHAIN" \
            CURRENT_PROJECT_VERSION=${{ steps.build.outputs.number }}

      - name: Export signed pkg
        run: |
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>teamID</key><string>6GUXT43C8B</string>
            <key>signingStyle</key><string>manual</string>
            <key>signingCertificate</key><string>Apple Distribution: Tella HQ Inc. (6GUXT43C8B)</string>
            <key>installerSigningCertificate</key><string>3rd Party Mac Developer Installer: Tella HQ Inc. (6GUXT43C8B)</string>
            <key>provisioningProfiles</key>
            <dict>
              <key>dev.tella.os1</key><string>OS1 Mac App Store</string>
            </dict>
            <key>destination</key><string>export</string>
          </dict>
          </plist>
          PLIST
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/OS1Mac.xcarchive" \
            -exportPath "$RUNNER_TEMP/export" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist"

      - name: Upload to TestFlight
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          xcrun altool --upload-app -f "$RUNNER_TEMP/export/OS1.pkg" -t macos \
            --apiKey "$ASC_KEY_ID" --apiIssuer "$ASC_ISSUER_ID"
