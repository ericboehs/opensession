name: Release OS1 for iOS (TestFlight)

# Builds, signs and uploads the native SwiftUI OS1 iOS client to TestFlight
# whenever iOS code lands on master. Signing mirrors the manual path that works
# for this team: cloud-managed *distribution* signing is forbidden for our App
# Store Connect key's role, so we import a stored Apple Distribution cert + the
# "OS1 App Store" provisioning profile and sign manually (development/automatic
# signing is NOT used here). See os1-mac-release.yml for the sibling Mac shell.

on:
  push:
    branches: [master]
    paths:
      # Build inputs only — docs (AGENTS.md/CLAUDE.md/README.md) land in
      # os1-ios/ constantly and must not each ship a TestFlight build.
      - "os1-ios/**"
      - "!os1-ios/**.md"
      - ".github/workflows/os1-ios-testflight.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: os1-ios-testflight-${{ github.event_name == 'workflow_dispatch' && github.run_id || 'push' }}
  cancel-in-progress: false

defaults:
  run:
    working-directory: os1-ios

jobs:
  testflight:
    runs-on: macos-26
    timeout-minutes: 45
    env:
      HOMEBREW_NO_AUTO_UPDATE: "1"
      OS1_DERIVED_DATA: ${{ runner.temp }}/os1-dd-ios
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Fingerprint build tools
        id: build-tools
        run: |
          FINGERPRINT=$(
            { xcodebuild -version; xcodegen --version; } |
              shasum -a 256 | cut -d ' ' -f 1
          )
          echo "fingerprint=$FINGERPRINT" >> "$GITHUB_OUTPUT"

      # SwiftStreamingMarkdown's package graph dominates clean builds. Keep one
      # DerivedData tree so tests and the device archive reuse package work.
      - name: Restore Xcode build cache
        id: build-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            ${{ env.OS1_DERIVED_DATA }}/Build
            ${{ env.OS1_DERIVED_DATA }}/SourcePackages
            ${{ env.OS1_DERIVED_DATA }}/ModuleCache.noindex
          key: os1-dd-v1-ios-${{ runner.os }}-${{ runner.arch }}-${{ steps.build-tools.outputs.fingerprint }}-${{ hashFiles('os1-ios/project.yml') }}

      - name: Import Apple Distribution certificate
        uses: apple-actions/import-codesign-certs@5142e029c445c10ffc7149d172e540235a065466 # v7.0.0
        with:
          p12-file-base64: ${{ secrets.OS1_IOS_DIST_P12_BASE64 }}
          p12-password: ${{ secrets.OS1_IOS_DIST_P12_PASSWORD }}

      - name: Install App Store provisioning profile
        env:
          PROFILE_BASE64: ${{ secrets.OS1_IOS_PROVISIONING_PROFILE_BASE64 }}
        run: |
          test -n "$PROFILE_BASE64"
          PROFILES="$HOME/Library/MobileDevice/Provisioning Profiles"
          mkdir -p "$PROFILES"
          printf '%s' "$PROFILE_BASE64" | base64 -D > "$PROFILES/OS1_App_Store.mobileprovision"
          # Sanity: it must be the App Store profile for our bundle id.
          security cms -D -i "$PROFILES/OS1_App_Store.mobileprovision" > /tmp/os1-ios-profile.plist
          /usr/libexec/PlistBuddy -c 'Print :Entitlements:application-identifier' /tmp/os1-ios-profile.plist | grep -q 'dev.tella.os1'

      - name: Install App Store Connect API key
        env:
          ASC_KEY_P8_BASE64: ${{ secrets.ASC_API_KEY_P8_BASE64 }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
        run: |
          test -n "$ASC_KEY_P8_BASE64"
          KEYS="$HOME/.appstoreconnect/private_keys"
          mkdir -p "$KEYS"
          printf '%s' "$ASC_KEY_P8_BASE64" | base64 -D > "$KEYS/AuthKey_${ASC_KEY_ID}.p8"

      - name: Compute build number
        id: build
        run: |
          # Builds 1 and 2 were uploaded manually before this pipeline existed;
          # offset by 2 so CI build numbers stay strictly increasing.
          BN=$(( 2 + GITHUB_RUN_NUMBER ))
          echo "number=$BN" >> "$GITHUB_OUTPUT"
          echo "iOS build number: $BN"

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Run unit tests
        run: |
          # Any available iPhone simulator will do; the suite is pure logic.
          UDID=$(xcrun simctl list devices available | grep iPhone | grep -m1 -oE '[0-9A-F-]{36}')
          test -n "$UDID"
          xcodebuild test \
            -skipMacroValidation \
            -project OS1.xcodeproj \
            -scheme OS1 \
            -destination "id=$UDID" \
            -derivedDataPath "$OS1_DERIVED_DATA" \
            COMPILER_INDEX_STORE_ENABLE=NO \
            CODE_SIGNING_ALLOWED=NO

      - name: Archive
        run: |
          xcodebuild archive \
            -skipMacroValidation \
            -project OS1.xcodeproj \
            -scheme OS1 \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$OS1_DERIVED_DATA" \
            -archivePath "$RUNNER_TEMP/OS1.xcarchive" \
            COMPILER_INDEX_STORE_ENABLE=NO \
            CURRENT_PROJECT_VERSION=${{ steps.build.outputs.number }}
          # Manual signing (style/identity/profile) lives in project.yml's
          # Release config, scoped to the app target: command-line settings
          # apply to every target, and SwiftPM package targets reject
          # provisioning profiles, failing the archive.

      - name: Export signed IPA
        run: |
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>teamID</key><string>6GUXT43C8B</string>
            <key>signingStyle</key><string>manual</string>
            <key>signingCertificate</key><string>Apple Distribution: Tella HQ Inc. (6GUXT43C8B)</string>
            <key>provisioningProfiles</key>
            <dict>
              <key>dev.tella.os1</key><string>OS1 App Store</string>
            </dict>
            <key>destination</key><string>export</string>
            <key>uploadSymbols</key><true/>
          </dict>
          </plist>
          PLIST
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/OS1.xcarchive" \
            -exportPath "$RUNNER_TEMP/export" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist"

      - name: Upload to TestFlight
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          xcrun altool --upload-app -f "$RUNNER_TEMP/export/OS1.ipa" -t ios \
            --apiKey "$ASC_KEY_ID" --apiIssuer "$ASC_ISSUER_ID"

      - name: Remove signed products from build cache
        if: steps.build-cache.outputs.cache-hit != 'true'
        run: find "$OS1_DERIVED_DATA/Build" -type d -name '*.app' -prune -exec rm -rf {} +

      # This package/toolchain key is deliberately stable: app sources still
      # rebuild, while unchanged dependency artifacts avoid a fresh compile.
      - name: Save Xcode build cache
        if: steps.build-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            ${{ env.OS1_DERIVED_DATA }}/Build
            ${{ env.OS1_DERIVED_DATA }}/SourcePackages
            ${{ env.OS1_DERIVED_DATA }}/ModuleCache.noindex
          key: os1-dd-v1-ios-${{ runner.os }}-${{ runner.arch }}-${{ steps.build-tools.outputs.fingerprint }}-${{ hashFiles('os1-ios/project.yml') }}

  cooldown:
    needs: testflight
    if: ${{ !cancelled() && github.event_name == 'push' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Hold automatic release cooldown
        working-directory: .
        run: sleep 900
